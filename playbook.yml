---
- name: Configure GraftGIS Instance Locally
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Clean up broken PPA sources before any apt update runs
      ansible.builtin.shell: "rm -f /etc/apt/sources.list.d/*ondrej* /etc/apt/sources.list.d/*php*"
      changed_when: false

    - name: Run apt update and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Remove unneeded dependencies (apt autoremove)
      ansible.builtin.apt:
        autoremove: true

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if needed
      ansible.builtin.reboot:
        msg: "Rebooting machine by Ansible after package updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists

    # -------------------------------------------------------------------------
    # Prerequisites & Repositories
    # -------------------------------------------------------------------------
    - name: Ensure prerequisite tools are installed
      ansible.builtin.apt:
        name:
          - software-properties-common
          - curl
          - git
          - unzip
          - acl
          - util-linux
          - tmux
          - ca-certificates
          - gnupg
          - python3-venv
          - python3-pip
          - postgresql-client
          - mariadb-client
        state: present
        update_cache: true

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
        force: false

    - name: Add NodeSource Node.js repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_22.x nodistro main"
        state: present
        update_cache: true

    # -------------------------------------------------------------------------
    # System Packages & Runtimes
    # -------------------------------------------------------------------------
    - name: Install Nginx, PHP 8.5, Node.js, and MariaDB
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
          - nodejs
          - mariadb-server
          - php8.5-fpm
          - php8.5-cli
          - php8.5-mysql
          - php8.5-mbstring
          - php8.5-xml
          - php8.5-curl
          - php8.5-zip
          - php8.5-gd
          - php8.5-intl
          - php8.5-bcmath
        state: present

    - name: Download Composer installer
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        mode: "0644"
        force: false

    - name: Run Composer installer
      ansible.builtin.command:
        cmd: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        creates: /usr/local/bin/composer

    - name: Clean up Composer installer
      ansible.builtin.file:
        path: /tmp/composer-setup.php
        state: absent

    # -------------------------------------------------------------------------
    # Database Initialization (Local MariaDB)
    # -------------------------------------------------------------------------
    - name: Ensure MariaDB service is running and enabled
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true

    - name: Bootstrap application database and user
      ansible.builtin.shell: |
        mysql -u root <<EOF
        CREATE DATABASE IF NOT EXISTS graft CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS 'graft_admin'@'127.0.0.1' IDENTIFIED BY 'h2Hfti_zQg78uCic';
        GRANT ALL PRIVILEGES ON graft.* TO 'graft_admin'@'127.0.0.1';
        FLUSH PRIVILEGES;
        EOF
      changed_when: false

    # -------------------------------------------------------------------------
    # App User, Storage Paths & Permissions
    # -------------------------------------------------------------------------
    - name: Create deploy system user
      ansible.builtin.user:
        name: "deploy"
        shell: /bin/bash
        groups: www-data
        append: true
        create_home: true

    - name: Create required folders on mounted storage
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "deploy"
        group: www-data
        mode: "0775"
      loop:
        - "/srv/graft"
        - "/srv/graft/logs"
        - "/srv/graft/logs/fastapi"
        - "/srv/graft/storage"
        - "/srv/graft/bootstrap/cache"

    - name: Enforce POSIX ACLs across storage and cache
      ansible.posix.acl:
        path: "{{ item.0 }}"
        entity: "{{ item.1 }}"
        etype: user
        permissions: rwX
        state: present
        default: "{{ item.2 }}"
      loop:
        - ["/srv/graft/storage", "www-data", false]
        - ["/srv/graft/storage", "deploy", false]
        - ["/srv/graft/storage", "www-data", true]
        - ["/srv/graft/storage", "deploy", true]
        - ["/srv/graft/bootstrap/cache", "www-data", false]
        - ["/srv/graft/bootstrap/cache", "deploy", false]
        - ["/srv/graft/bootstrap/cache", "www-data", true]
        - ["/srv/graft/bootstrap/cache", "deploy", true]

    - name: Ensure Nginx and PHP-FPM are enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - php8.5-fpm
