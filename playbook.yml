---
- name: Configure GraftGIS Instance Locally
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Clean up broken PPA sources before any apt update runs
      ansible.builtin.shell: "rm -f /etc/apt/sources.list.d/*ondrej* /etc/apt/sources.list.d/*php*"
      changed_when: false

    - name: Run apt update and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Remove unneeded dependencies (apt autoremove)
      ansible.builtin.apt:
        autoremove: true

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if needed
      ansible.builtin.reboot:
        msg: "Rebooting machine by Ansible after package updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists

    # -------------------------------------------------------------------------
    # Prerequisites & Repositories
    # -------------------------------------------------------------------------
    - name: Ensure prerequisite tools are installed
      ansible.builtin.apt:
        name:
          - software-properties-common
          - curl
          - git
          - unzip
          - acl
          - util-linux
          - tmux
          - ca-certificates
          - gnupg
          - python3-venv
          - python3-pip
          - postgresql-client
          - mariadb-client
        state: present
        update_cache: true

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
        force: false

    - name: Add NodeSource Node.js repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        update_cache: true

    # -------------------------------------------------------------------------
    # System Packages & Runtimes
    # -------------------------------------------------------------------------
    - name: Install Nginx, PHP 8.5, Node.js, and MariaDB
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
          - nodejs
          - mariadb-server
          - php{{ php_version }}-fpm
          - php{{ php_version }}-cli
          - php{{ php_version }}-mysql
          - php{{ php_version }}-mbstring
          - php{{ php_version }}-xml
          - php{{ php_version }}-curl
          - php{{ php_version }}-zip
          - php{{ php_version }}-gd
          - php{{ php_version }}-intl
          - php{{ php_version }}-bcmath
        state: present

    - name: Download Composer installer
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        mode: "0644"
        force: false

    - name: Run Composer installer
      ansible.builtin.command:
        cmd: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        creates: /usr/local/bin/composer

    - name: Clean up Composer installer
      ansible.builtin.file:
        path: /tmp/composer-setup.php
        state: absent

    # -------------------------------------------------------------------------
    # Database Initialization (Local MariaDB)
    # -------------------------------------------------------------------------
    - name: Ensure MariaDB service is running and enabled
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true

    - name: Bootstrap application database and user
      ansible.builtin.shell: |
        mysql -u root <<EOF
        CREATE DATABASE IF NOT EXISTS graft CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ mysql_user }}'@'{{ mysql_endpoint }}' IDENTIFIED BY '{{ mysql_pass }}';
        GRANT ALL PRIVILEGES ON graft.* TO '{{ mysql_user }}'@'{{ mysql_endpoint }}';
        FLUSH PRIVILEGES;
        EOF
      changed_when: false

    # -------------------------------------------------------------------------
    # App User, Storage Paths & Permissions
    # -------------------------------------------------------------------------
    - name: Create deploy system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        groups: "{{ app_group }}"
        append: true
        create_home: true

    - name: Create required folders on mounted storage
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0775"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/logs/fastapi"
        - "{{ app_dir }}/storage"
        - "{{ app_dir }}/bootstrap/cache"

    - name: Enforce POSIX ACLs across storage and cache
      ansible.posix.acl:
        path: "{{ item.0 }}"
        entity: "{{ item.1 }}"
        etype: user
        permissions: rwX
        state: present
        default: "{{ item.2 }}"
      loop:
        - ["{{ app_dir }}/storage", "{{ app_group }}", false]
        - ["{{ app_dir }}/storage", "{{ app_user }}", false]
        - ["{{ app_dir }}/storage", "{{ app_group }}", true]
        - ["{{ app_dir }}/storage", "{{ app_user }}", true]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_group }}", false]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_user }}", false]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_group }}", true]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_user }}", true]

    - name: Ensure Nginx and PHP-FPM are enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - php{{ php_version }}-fpm

    # -------------------------------------------------------------------------
    # 1. Repository Checkout & Directory Structure
    # -------------------------------------------------------------------------
    - name: Check if directory is already an initialized git repository
      ansible.builtin.stat:
        path: "{{ app_dir }}/.git"
      register: git_repo_check

    - name: Find all items inside /srv/graft if not a valid git repo
      ansible.builtin.find:
        paths: "{{ app_dir }}"
        file_type: any
        hidden: true
      register: directory_contents
      when: not git_repo_check.stat.exists

    - name: Remove all existing contents inside /srv/graft
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ directory_contents.files }}"
      when: not git_repo_check.stat.exists

    - name: Clone GraftGIS repository
      ansible.builtin.git:
        repo: "git@github.com:Fossphorus2016/ground-truth.git"
        dest: "{{ app_dir }}"
        version: "main"
        accept_hostkey: true
        key_file: /home/ubuntu/.ssh/id_ed25519
        force: "true"

    - name: Ensure runtime storage and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0775"
      loop:
        - "{{ app_dir }}/logs/fastapi"
        - "{{ app_dir }}/storage/framework/sessions"
        - "{{ app_dir }}/storage/framework/views"
        - "{{ app_dir }}/storage/framework/cache"
        - "{{ app_dir }}/bootstrap/cache"

    - name: Set persistent ACLs on storage and cache
      ansible.posix.acl:
        path: "{{ item.0 }}"
        entity: "{{ item.1 }}"
        etype: user
        permissions: rwX
        state: present
        default: "{{ item.2 }}"
      loop:
        - ["{{ app_dir }}/storage", "{{ app_group }}", false]
        - ["{{ app_dir }}/storage", "{{ app_user }}", false]
        - ["{{ app_dir }}/storage", "{{ app_group }}", true]
        - ["{{ app_dir }}/storage", "{{ app_user }}", true]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_group }}", false]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_user }}", false]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_group }}", true]
        - ["{{ app_dir }}/bootstrap/cache", "{{ app_user }}", true]

    # -------------------------------------------------------------------------
    # 2. Python Virtual Environments Setup
    # -------------------------------------------------------------------------
    - name: Run 01-setup.sh for GIS loader environment
      ansible.builtin.command:
        cmd: "bash scripts/server/01-setup.sh"
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/.venv-loader/bin/activate"
      become: true
      become_user: "{{ app_user }}"

    - name: Set up FastAPI virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv .venv"
        chdir: "{{ app_dir }}/services/fastapi"
        creates: "{{ app_dir }}/services/fastapi/.venv/bin/activate"
      become: true
      become_user: "{{ app_user }}"

    - name: Install FastAPI Python requirements
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/services/fastapi/requirements.txt"
        virtualenv: "{{ app_dir }}/services/fastapi/.venv"
      become: true
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # 3. Environment Secret Generation & Configuration
    # -------------------------------------------------------------------------
    - name: Check if sync token already exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/.sync_token"
      register: sync_token_file

    - name: Generate internal sync token if missing
      ansible.builtin.shell: "python3 -c 'import secrets; print(secrets.token_urlsafe(32))' > {{ app_dir }}/.sync_token"
      when: not sync_token_file.stat.exists

    - name: Read sync token
      ansible.builtin.slurp:
        src: "{{ app_dir }}/.sync_token"
      register: raw_sync_token

    - name: Set sync_token fact
      ansible.builtin.set_fact:
        sync_token: "{{ raw_sync_token['content'] | b64decode | trim }}"

    - name: Render scripts/server/gt.env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/scripts/server/gt.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
        content: |
          GIS_DATABASE_URL="postgresql://{{ postgres_user }}:{{ posgres_pass }}@{{ postgres_endpoint }}:5432/{{ postgres_db_name }}?sslmode=require"

    - name: Render FastAPI .env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/services/fastapi/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
        content: |
          APP_ENV=production
          GIS_DATABASE_URL=postgresql://{{ postgres_user }}:{{ posgres_pass }}@{{ postgres_endpoint }}:5432/{{ postgres_db_name }}?sslmode=require
          SOURCES_SYNC_TOKEN={{ sync_token }}
          LARAVEL_BASE_URL={{ app_url }}

    - name: Render Laravel .env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
        content: |
          APP_NAME=GroundTruth
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL={{ app_url }}
          DB_CONNECTION=mysql
          DB_HOST={{ mysql_endpoint }}
          DB_PORT=3306
          DB_DATABASE={{ mysql_db_name }}
          DB_USERNAME={{ mysql_user }}
          DB_PASSWORD={{ mysql_pass }}
          FASTAPI_BASE_URL=http://{{ mysql_endpoint }}:8000
          SOURCES_SYNC_TOKEN={{ sync_token }}

    # -------------------------------------------------------------------------
    # 4. Dependency Build & Application Key Generation
    # -------------------------------------------------------------------------
    - name: Install Composer production dependencies
      ansible.builtin.shell: "composer install --no-dev --optimize-autoloader"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Generate Laravel application key if empty
      ansible.builtin.shell: "php artisan key:generate --force"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Install NPM dependencies and build frontend assets
      ansible.builtin.shell: "npm ci && npm run build"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # 5. Database Schema Migrations
    # -------------------------------------------------------------------------
    - name: Run Alembic PostGIS schema migrations against RDS
      ansible.builtin.shell: |
        set -a; . ../scripts/server/gt.env; set +a
        ../.venv-loader/bin/python -m alembic -c alembic.ini upgrade head
      args:
        chdir: "{{ app_dir }}/gis"
      become_user: "{{ app_user }}"

    - name: Run Laravel database migrations against local MariaDB
      ansible.builtin.shell: |
        php artisan migrate --force
        php artisan db:seed --class=PermissionSeeder --force
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    # -------------------------------------------------------------------------
    # 6. Service Management & Verification
    # -------------------------------------------------------------------------
    - name: Link and install systemd service units
      ansible.builtin.copy:
        src: "{{ app_dir }}/scripts/server/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - groundtruth-fastapi.service
        - groundtruth-queue.service

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start systemd services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - groundtruth-fastapi.service
        - groundtruth-queue.service

    - name: Verify FastAPI health endpoint
      ansible.builtin.uri:
        url: "http://{{ mysql_endpoint }}:8000/health"
        status_code: 200
        return_content: true
      register: health_check
      retries: 5
      delay: 3
      until: health_check.status == 200
